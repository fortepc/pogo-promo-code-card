<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Code QR Generator | Community Ambassador</title>
    
    <!-- Load required libraries from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        /* Base Styling */
        :root {
            --pokemongo-teal: #1FBDB2;
            --pokemongo-blue: #22668D;
            --pokemongo-red: #E3352F;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--pokemongo-blue);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--pokemongo-teal);
            outline: none;
        }

        input:disabled, textarea:disabled, select:disabled {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            border-color: #ddd;
        }

        textarea {
            resize: vertical;
            font-family: monospace;
        }

        .help-text {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--pokemongo-teal);
            color: white;
        }

        .btn-cancel {
            background-color: var(--pokemongo-red);
            color: white;
            display: none;
        }

        .btn-secondary {
            background-color: var(--pokemongo-blue);
            color: white;
            display: none;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        /* Status & Preview Area */
        #statusMessage {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            color: var(--pokemongo-blue);
            min-height: 24px;
        }

        #previewArea {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Scale down the high-res canvases for the screen preview */
        #previewArea canvas {
            max-width: 100%;
            height: auto;
            max-height: 400px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Community Ambassador QR Generator</h1>
    <p class="subtitle">Convert promo codes into high-res printable redemption cards.</p>

    <div class="form-group">
        <label for="cardSize">Output Size / Format</label>
        <select id="cardSize">
            <option value="600,1050">US Business Card - Portrait (2" x 3.5")</option>
            <option value="650,1004">EU Business Card - Portrait (55mm x 85mm)</option>
            <option value="750,1050">Trading Card Size (2.5" x 3.5")</option>
            <option value="900,900">Square Card (3" x 3")</option>
            <option value="1200,1800">Photo / Postcard (4" x 6")</option>
        </select>
        <div class="help-text">Images are generated at 300 DPI for professional print quality.</div>
    </div>

    <div class="form-group">
        <label for="eventName">Event Name (Optional)</label>
        <input type="text" id="eventName" placeholder="e.g., August Community Day Giveaway" value="Community Day Giveaway">
    </div>

    <div class="form-group">
        <label for="prefix">QR Code Base URL / Prefix</label>
        <input type="text" id="prefix" value="https://store.pokemongo.com/offer-redemption?passcode=">
        <div class="help-text">This is the official web store URL structure that pre-fills the code for the user.</div>
    </div>

    <div class="form-group">
        <label for="codes">Promo Codes</label>
        <textarea id="codes" rows="5" placeholder="Paste codes here, separated by commas... (e.g., 62EGDH625ABMP, XYZ987ABC123)"></textarea>
    </div>

    <div class="button-group">
        <button id="generateBtn" class="btn-primary" onclick="startGeneration()">Generate Cards</button>
        <button id="cancelBtn" class="btn-cancel" onclick="cancelGeneration()">Cancel Generation</button>
        <button id="downloadBtn" class="btn-secondary" onclick="downloadZip()">Download ZIP</button>
    </div>

    <div id="statusMessage"></div>
    <div id="previewArea"></div>
</div>

<script>
    let generatedZip = null;
    let isCancelled = false;

    // Helper function to lock/unlock UI
    function setUILocked(locked) {
        document.getElementById('cardSize').disabled = locked;
        document.getElementById('eventName').disabled = locked;
        document.getElementById('prefix').disabled = locked;
        document.getElementById('codes').disabled = locked;
        
        document.getElementById('generateBtn').style.display = locked ? 'none' : 'block';
        document.getElementById('cancelBtn').style.display = locked ? 'block' : 'none';
        
        if (locked) {
            document.getElementById('downloadBtn').style.display = 'none';
        }
    }

    function cancelGeneration() {
        isCancelled = true;
        document.getElementById('statusMessage').innerText = "Canceling... please wait for current card to finish.";
        document.getElementById('cancelBtn').disabled = true; // Prevent spam clicking
    }

    // Helper function to generate QR Code data URL at a higher resolution
    function createQRCode(text, size) {
        return new Promise((resolve) => {
            const tempDiv = document.createElement('div');
            new QRCode(tempDiv, {
                text: text,
                width: size,
                height: size,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
            
            setTimeout(() => {
                const canvas = tempDiv.querySelector('canvas');
                resolve(canvas.toDataURL("image/png"));
            }, 50); // Slight delay ensures rendering finishes
        });
    }

    async function startGeneration() {
        const codesInput = document.getElementById('codes').value;
        const prefix = document.getElementById('prefix').value;
        const eventName = document.getElementById('eventName').value || "Pokémon GO Promo";
        
        // Parse selected dimensions
        const sizeSelection = document.getElementById('cardSize').value.split(',');
        const cWidth = parseInt(sizeSelection[0]);
        const cHeight = parseInt(sizeSelection[1]);
        
        const codes = codesInput.split(',')
            .map(c => c.trim())
            .filter(c => c.length > 0);

        if (codes.length === 0) {
            alert("Please enter at least one promo code.");
            return;
        }

        // Reset state
        isCancelled = false;
        document.getElementById('cancelBtn').disabled = false;
        setUILocked(true);
        generatedZip = null;
        
        const previewArea = document.getElementById('previewArea');
        const statusMessage = document.getElementById('statusMessage');
        
        previewArea.innerHTML = '';
        statusMessage.innerText = `Starting generation for ${codes.length} cards...`;
        
        const zip = new JSZip();
        const folder = zip.folder("pokemon_go_cards");
        let processedCount = 0;

        for (let i = 0; i < codes.length; i++) {
            if (isCancelled) break;
            
            let code = codes[i];
            statusMessage.innerText = `Working: Generating card ${i + 1} of ${codes.length}...`;
            
            const canvas = document.createElement('canvas');
            canvas.width = cWidth; 
            canvas.height = cHeight;
            const ctx = canvas.getContext('2d');
            
            // Layout Calculations
            const centerX = cWidth / 2;
            const borderThickness = Math.max(12, Math.floor(cWidth * 0.025));
            const titleY = cHeight * 0.10;
            const qrSize = Math.floor(Math.min(cWidth, cHeight) * 0.50);
            const qrX = (cWidth - qrSize) / 2;
            const qrY = cHeight * 0.15;
            const qrBottom = qrY + qrSize;
            const remainingSpace = cHeight - qrBottom;
            const codeY = qrBottom + (remainingSpace * 0.25);
            const instY = qrBottom + (remainingSpace * 0.50);
            const orY = qrBottom + (remainingSpace * 0.70);
            const urlY = qrBottom + (remainingSpace * 0.88);

            // 1. Draw Background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, cWidth, cHeight);
            
            // 2. Draw Teal Border
            ctx.strokeStyle = "#1FBDB2";
            ctx.lineWidth = borderThickness;
            ctx.strokeRect(borderThickness/2, borderThickness/2, cWidth - borderThickness, cHeight - borderThickness);
            
            // 3. Draw Event Title
            ctx.fillStyle = "#22668D";
            const titleFont = Math.floor(cWidth * 0.055);
            ctx.font = `bold ${titleFont}px 'Segoe UI', Arial, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(eventName, centerX, titleY);
            
            // 4. Generate & Draw QR Code
            const qrDataUrl = await createQRCode(prefix + code, qrSize);
            const qrImg = new Image();
            qrImg.src = qrDataUrl;
            
            await new Promise(r => qrImg.onload = r);
            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            
            // 5. Draw Promo Code Text
            ctx.fillStyle = "#E3352F";
            const codeFont = Math.floor(cWidth * 0.08);
            ctx.font = `bold ${codeFont}px 'Courier New', monospace`;
            ctx.fillText(code, centerX, codeY);
            
            // 6. Draw Instructions
            ctx.fillStyle = "#444444";
            const instFont = Math.floor(cWidth * 0.045);
            ctx.font = `${instFont}px 'Segoe UI', Arial, sans-serif`;
            ctx.fillText("Scan to redeem your items!", centerX, instY);
            
            ctx.fillStyle = "#777777";
            const orFont = Math.floor(cWidth * 0.035);
            ctx.font = `${orFont}px 'Segoe UI', Arial, sans-serif`;
            ctx.fillText("Or manually redeem at:", centerX, orY);
            
            ctx.fillStyle = "#22668D";
            const urlFont = Math.floor(cWidth * 0.032);
            ctx.font = `bold ${urlFont}px 'Segoe UI', Arial, sans-serif`;
            ctx.fillText("store.pokemongo.com/offer-redemption", centerX, urlY);
            
            // Append to screen preview
            previewArea.appendChild(canvas);
            
            // Add canvas image to ZIP file
            const dataURL = canvas.toDataURL("image/png");
            const base64Data = dataURL.replace(/^data:image\/(png|jpg);base64,/, "");
            folder.file(`${code}.png`, base64Data, {base64: true});
            
            processedCount++;
            
            // Yield back to the browser's main thread to allow UI updates and button clicks
            await new Promise(resolve => setTimeout(resolve, 10));
        }
        
        if (isCancelled) {
            statusMessage.innerText = `Job canceled. Packaged ${processedCount} of ${codes.length} cards.`;
        } else {
            statusMessage.innerText = "Processing ZIP file... please wait.";
        }

        if (processedCount > 0) {
            generatedZip = await zip.generateAsync({type:"blob"});
            if (!isCancelled) {
                statusMessage.innerText = `Success! Generated all ${processedCount} cards.`;
            }
            document.getElementById('downloadBtn').style.display = 'block';
            document.getElementById('downloadBtn').innerText = `Download ZIP (${processedCount} Cards)`;
        } else {
            statusMessage.innerText = "Canceled before any cards were completely generated.";
        }
        
        setUILocked(false);
    }

    function downloadZip() {
        if (generatedZip) {
            saveAs(generatedZip, "pokemongo_promo_cards.zip");
        }
    }
</script>

</body>
</html>
